<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 564" width="1020" height="564">
<defs>
  <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#868e96" />
  </marker>
  <style>text { font-family: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif; }</style>
</defs>

<!-- Title -->
<text x="510" y="28" font-size="22" fill="#228be6" text-anchor="middle" font-weight="600">mlflow-modal-deploy Architecture</text>

<!-- Row 1: MLflow Model Registry -->
<rect x="366" y="48" width="288" height="48" rx="8" stroke="#f8f9fa" fill="#228be6" stroke-width="1" />
<text x="510" y="72" font-size="15" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">MLflow Model Registry</text>
<text x="370" y="112" font-size="11" fill="#868e96">runs:/{run_id}/model</text>

<!-- Arrow down -->
<path d="M 510 96 L 510 128" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />

<!-- Row 2: Plugin -->
<rect x="346" y="128" width="328" height="48" rx="8" stroke="#f8f9fa" fill="#3b5bdb" stroke-width="1" />
<text x="510" y="152" font-size="15" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">mlflow-modal-deploy plugin</text>
<text x="350" y="192" font-size="11" fill="#868e96">client.create_deployment()</text>

<!-- Fan-out arrows -->
<path d="M 418 176 L 168 212" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />
<path d="M 510 176 L 510 212" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />
<path d="M 602 176 L 852 212" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />

<!-- Row 3: Three parallel steps -->
<rect x="40" y="212" width="256" height="48" rx="8" stroke="#f8f9fa" fill="#5c7cfa" stroke-width="1" />
<text x="168" y="236" font-size="13" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">Extract dependencies</text>

<rect x="382" y="212" width="256" height="48" rx="8" stroke="#f8f9fa" fill="#5c7cfa" stroke-width="1" />
<text x="510" y="236" font-size="13" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">Generate Modal app.py</text>

<rect x="724" y="212" width="256" height="48" rx="8" stroke="#f8f9fa" fill="#5c7cfa" stroke-width="1" />
<text x="852" y="236" font-size="13" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">Upload to Modal Volume</text>

<!-- Fan-in arrows -->
<path d="M 168 260 L 510 296" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />
<path d="M 510 260 L 510 296" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />
<path d="M 852 260 L 510 296" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />

<!-- Row 4: modal deploy -->
<rect x="390" y="296" width="240" height="48" rx="8" stroke="#f8f9fa" fill="#1864ab" stroke-width="1" />
<text x="510" y="320" font-size="13" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">modal deploy app.py</text>
<text x="394" y="358" font-size="11" fill="#868e96">CLI subprocess</text>

<!-- Arrow down -->
<path d="M 510 344 L 510 376" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />

<!-- Row 5: Modal Cloud container -->
<rect x="112" y="376" width="796" height="116" rx="8" stroke="#40c057" fill="#087f5b" stroke-width="1" />
<text x="128" y="394" font-size="12" fill="#96f2d7" font-weight="500">Modal Cloud</text>

<!-- Inner row 1: infrastructure -->
<rect x="136" y="402" width="176" height="36" rx="6" stroke="#f8f9fa" fill="#087f5b" stroke-width="1" />
<text x="224" y="420" font-size="12" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">Container + GPU</text>

<rect x="328" y="402" width="168" height="36" rx="6" stroke="#f8f9fa" fill="#087f5b" stroke-width="1" />
<text x="412" y="420" font-size="12" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">Model Volume</text>

<rect x="512" y="402" width="188" height="36" rx="6" stroke="#212529" fill="#12b886" stroke-width="1" />
<text x="606" y="420" font-size="12" fill="#212529" text-anchor="middle" dominant-baseline="central">Auto-scaling 0&#x2192;N</text>

<!-- Inner row 2: endpoints -->
<rect x="136" y="448" width="176" height="36" rx="6" stroke="#212529" fill="#12b886" stroke-width="1" />
<text x="224" y="466" font-size="12" fill="#212529" text-anchor="middle" dominant-baseline="central">/predict</text>

<rect x="328" y="448" width="168" height="36" rx="6" stroke="#212529" fill="#12b886" stroke-width="1" />
<text x="412" y="466" font-size="12" fill="#212529" text-anchor="middle" dominant-baseline="central">/predict_stream</text>

<!-- Arrow down -->
<path d="M 510 492 L 510 516" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />

<!-- Row 6: Output -->
<rect x="310" y="516" width="400" height="40" rx="8" stroke="#212529" fill="#12b886" stroke-width="1" />
<text x="510" y="536" font-size="13" fill="#212529" text-anchor="middle" dominant-baseline="central">client.predict() / predict_stream()</text>
</svg>
