<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 860" width="680" height="860">
<defs>
  <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#868e96" />
  </marker>
  <marker id="arr-dash" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#868e96" />
  </marker>
  <style>
    text { font-family: "Segoe UI", system-ui, -apple-system, sans-serif; }
  </style>
</defs>

<!-- Title -->
<text x="340" y="28" font-size="22" fill="#228be6" text-anchor="middle" font-weight="600">Guardrails AI Scorer Pipeline</text>

<!-- ROW 1: Entry point -->
<rect x="140" y="52" width="360" height="48" rx="8" fill="#228be6" />
<text x="320" y="76" font-size="14" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">scorer(inputs=..., outputs=..., trace=...)</text>
<text x="516" y="76" font-size="11" fill="#868e96">MLflow Scorer API</text>

<!-- Arrow down -->
<path d="M 320 100 L 320 148" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />

<!-- ROW 2: Decision - outputs provided? -->
<polygon points="320,156 468,200 320,244 172,200" fill="#fab005" stroke="#343a40" stroke-width="1" />
<text x="320" y="200" font-size="14" fill="#212529" text-anchor="middle" dominant-baseline="central">outputs provided?</text>

<!-- "No" arrow right -->
<path d="M 468 200 L 512 200" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />
<text x="476" y="190" font-size="13" fill="#fa5252" font-weight="600">No</text>

<!-- "No" branch box -->
<rect x="516" y="176" width="152" height="48" rx="8" fill="#5c7cfa" />
<text x="592" y="194" font-size="12" fill="#f8f9fa" text-anchor="middle">use inputs or</text>
<text x="592" y="210" font-size="12" fill="#f8f9fa" text-anchor="middle">extract from trace</text>

<!-- Dashed return path from "No" box back to main flow -->
<path d="M 592 224 L 592 296 L 500 296" stroke="#868e96" fill="none" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arr-dash)" />

<!-- "Yes" arrow down -->
<path d="M 320 244 L 320 284" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />
<text x="332" y="268" font-size="13" fill="#40c057" font-weight="600">Yes</text>

<!-- ROW 3: Resolve text -->
<rect x="140" y="292" width="360" height="48" rx="8" fill="#3b5bdb" />
<text x="320" y="316" font-size="14" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">map_scorer_inputs_to_text()</text>
<text x="516" y="316" font-size="11" fill="#868e96">Resolve text to validate</text>

<!-- Arrow down -->
<path d="M 320 340 L 320 388" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />

<!-- ROW 4: Guardrails AI container -->
<rect x="88" y="396" width="464" height="120" rx="8" fill="#1864ab" fill-opacity="0.25" stroke="#4dabf7" stroke-width="1" />
<text x="104" y="416" font-size="11" fill="#4dabf7" font-weight="500">Guardrails AI</text>

<!-- Inner box: Guard().use(validator) -->
<rect x="112" y="428" width="192" height="44" rx="6" fill="#3b5bdb" />
<text x="208" y="450" font-size="13" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">Guard().use(validator)</text>

<!-- Arrow between inner boxes -->
<path d="M 304 450 L 340 450" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />

<!-- Inner box: guard.validate(text) -->
<rect x="344" y="428" width="184" height="44" rx="6" fill="#3b5bdb" />
<text x="436" y="450" font-size="13" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">guard.validate(text)</text>

<!-- Container annotation -->
<text x="112" y="494" font-size="10" fill="#4dabf7">OnFailAction.NOOP + **kwargs passthrough</text>

<!-- Exception path (dashed side note) -->
<rect x="568" y="432" width="100" height="48" rx="6" fill="none" stroke="#868e96" stroke-width="1" stroke-dasharray="4 2" />
<text x="618" y="450" font-size="10" fill="#868e96" text-anchor="middle">Exception?</text>
<text x="618" y="464" font-size="10" fill="#868e96" text-anchor="middle">Feedback(error=e)</text>
<path d="M 528 460 L 568 456" stroke="#868e96" fill="none" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arr-dash)" />

<!-- Arrow down -->
<path d="M 320 516 L 320 560" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />

<!-- ROW 5: Decision - validation_passed? -->
<polygon points="320,568 468,612 320,656 172,612" fill="#fab005" stroke="#343a40" stroke-width="1" />
<text x="320" y="612" font-size="14" fill="#212529" text-anchor="middle" dominant-baseline="central">validation_passed?</text>

<!-- "Yes" arrow bottom-left -->
<path d="M 208 624 L 136 680" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />
<text x="144" y="648" font-size="13" fill="#40c057" font-weight="600">Yes</text>

<!-- "No" arrow bottom-right -->
<path d="M 432 624 L 504 680" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />
<text x="472" y="648" font-size="13" fill="#fa5252" font-weight="600">No</text>

<!-- ROW 6: Result boxes -->
<rect x="16" y="688" width="240" height="48" rx="8" fill="#40c057" />
<text x="136" y="712" font-size="14" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">Feedback(value=YES)</text>
<text x="32" y="756" font-size="10" fill="#868e96">rationale = None</text>

<rect x="424" y="688" width="240" height="48" rx="8" fill="#e03131" />
<text x="544" y="712" font-size="14" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">Feedback(value=NO)</text>
<text x="440" y="756" font-size="10" fill="#868e96">rationale = failure summaries</text>

<!-- Convergence arrows to final box -->
<path d="M 136 736 L 320 784" stroke="#868e96" fill="none" stroke-width="1.5" marker-end="url(#arr)" />
<path d="M 544 736 L 320 784" stroke="#868e96" fill="none" stroke-width="1.5" marker-end="url(#arr)" />

<!-- ROW 7: Final result -->
<rect x="140" y="792" width="360" height="44" rx="8" fill="#12b886" />
<text x="320" y="814" font-size="13" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">source_type = CODE (deterministic)</text>
<text x="516" y="814" font-size="10" fill="#868e96">metadata: guardrails-ai</text>

</svg>