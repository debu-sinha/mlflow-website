<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1020 564" width="1020" height="564">
<defs>
  <marker id="arr" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
    <polygon points="0 0, 10 3.5, 0 7" fill="#868e96" />
  </marker>
  <style>text { font-family: "DM Sans", "Segoe UI", system-ui, -apple-system, sans-serif; }</style>
</defs>

<!-- Title -->
<text x="510" y="28" font-size="22" fill="#228be6" text-anchor="middle" font-weight="600">Guardrails AI Scorer Pipeline</text>

<!-- Row 1: Entry point -->
<rect x="310" y="46" width="400" height="42" rx="8" fill="#228be6" />
<text x="510" y="67" font-size="14" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">scorer(inputs=..., outputs=..., trace=...)</text>
<text x="726" y="67" font-size="11" fill="#868e96">MLflow Scorer API</text>

<!-- Arrow down -->
<path d="M 510 88 L 510 108" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />

<!-- Row 2: Decision - outputs provided? -->
<polygon points="510,112 642,144 510,176 378,144" fill="#fab005" stroke="#343a40" stroke-width="1" />
<text x="510" y="144" font-size="13" fill="#212529" text-anchor="middle" dominant-baseline="central">outputs provided?</text>

<!-- "No" arrow right -->
<path d="M 642 144 L 688 144" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />
<text x="650" y="134" font-size="12" fill="#e8590c" font-weight="600">No</text>

<!-- "No" branch box -->
<rect x="692" y="120" width="140" height="48" rx="8" fill="#5c7cfa" />
<text x="762" y="138" font-size="11" fill="#f8f9fa" text-anchor="middle">use inputs or</text>
<text x="762" y="154" font-size="11" fill="#f8f9fa" text-anchor="middle">extract from trace</text>

<!-- Dashed return from "No" box to Resolve step -->
<path d="M 762 168 L 762 221 L 714 221" stroke="#868e96" fill="none" stroke-width="1.5" stroke-dasharray="6 3" marker-end="url(#arr)" />

<!-- "Yes" arrow down -->
<path d="M 510 176 L 510 196" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />
<text x="522" y="190" font-size="12" fill="#0ca678" font-weight="600">Yes</text>

<!-- Row 3: Resolve text -->
<rect x="310" y="200" width="400" height="42" rx="8" fill="#3b5bdb" />
<text x="510" y="221" font-size="14" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">map_scorer_inputs_to_text()</text>
<text x="726" y="221" font-size="11" fill="#868e96">Resolve text</text>

<!-- Arrow down -->
<path d="M 510 242 L 510 260" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />

<!-- Row 4: Guardrails AI container -->
<rect x="216" y="264" width="456" height="92" rx="8" fill="#1864ab" fill-opacity="0.25" stroke="#4dabf7" stroke-width="1" />
<text x="232" y="282" font-size="12" fill="#4dabf7" font-weight="500">Guardrails AI</text>

<!-- Inner box: Guard().use(validator) -->
<rect x="236" y="288" width="180" height="38" rx="6" fill="#3b5bdb" />
<text x="326" y="307" font-size="12" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">Guard().use(validator)</text>

<!-- Arrow between inner boxes -->
<path d="M 416 307 L 444 307" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />

<!-- Inner box: guard.validate(text) -->
<rect x="448" y="288" width="172" height="38" rx="6" fill="#3b5bdb" />
<text x="534" y="307" font-size="12" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">guard.validate(text)</text>

<!-- Container annotation -->
<text x="236" y="340" font-size="11" fill="#4dabf7">OnFailAction.NOOP + **kwargs passthrough</text>

<!-- Exception path (dashed side note) -->
<rect x="696" y="288" width="100" height="42" rx="6" fill="none" stroke="#868e96" stroke-width="1" stroke-dasharray="4 2" />
<text x="746" y="304" font-size="11" fill="#868e96" text-anchor="middle">Exception?</text>
<text x="746" y="318" font-size="11" fill="#868e96" text-anchor="middle">Feedback(error=e)</text>
<path d="M 620 310 L 694 306" stroke="#868e96" fill="none" stroke-width="1" stroke-dasharray="4 2" marker-end="url(#arr)" />

<!-- Arrow down -->
<path d="M 510 356 L 510 376" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />

<!-- Row 5: Decision - validation_passed? -->
<polygon points="510,380 642,412 510,444 378,412" fill="#fab005" stroke="#343a40" stroke-width="1" />
<text x="510" y="412" font-size="13" fill="#212529" text-anchor="middle" dominant-baseline="central">validation_passed?</text>

<!-- "Yes" arrow bottom-left -->
<path d="M 430 428 L 340 464" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />
<text x="354" y="442" font-size="12" fill="#0ca678" font-weight="600">Yes</text>

<!-- "No" arrow bottom-right -->
<path d="M 590 428 L 680 464" stroke="#868e96" fill="none" stroke-width="2" marker-end="url(#arr)" />
<text x="624" y="442" font-size="12" fill="#e8590c" font-weight="600">No</text>

<!-- Row 6: Result boxes -->
<rect x="200" y="468" width="220" height="40" rx="8" fill="#087f5b" />
<text x="310" y="488" font-size="13" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">Feedback(value=YES)</text>

<rect x="600" y="468" width="220" height="40" rx="8" fill="#e03131" />
<text x="710" y="488" font-size="13" fill="#f8f9fa" text-anchor="middle" dominant-baseline="central">Feedback(value=NO)</text>

<!-- Convergence arrows to final box -->
<path d="M 310 508 L 510 530" stroke="#868e96" fill="none" stroke-width="1.5" marker-end="url(#arr)" />
<path d="M 710 508 L 510 530" stroke="#868e96" fill="none" stroke-width="1.5" marker-end="url(#arr)" />

<!-- Row 7: Final result -->
<rect x="310" y="532" width="400" height="28" rx="8" fill="#12b886" stroke="#212529" stroke-width="1" />
<text x="510" y="546" font-size="12" fill="#212529" text-anchor="middle" dominant-baseline="central">source_type = CODE (deterministic)</text>
<text x="726" y="546" font-size="11" fill="#868e96">metadata: guardrails-ai</text>

</svg>
